name: Build Cave Buddy

on:
  workflow_dispatch:
  push:
    paths:
      - "CaveBuddy-Source-Download.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Extract mod source
        run: |
          unzip -q CaveBuddy-Source-Download.zip -d source
          BUILD_FILE="$(find source -name build.gradle -o -name build.gradle.kts | head -n 1)"
          if [ -z "$BUILD_FILE" ]; then
            echo "Could not find build.gradle in the source archive."
            find source -maxdepth 3 -type f | head -n 80
            exit 1
          fi
          echo "MOD_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Build mod
        run: gradle --no-daemon build
        working-directory: ${{ env.MOD_DIR }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cave-buddy-jar
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
          if-no-files-found: error
