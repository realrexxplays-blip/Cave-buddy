name: Build Cave Buddy

on:
  workflow_dispatch:
  push:
    paths:
      - "CaveBuddy-Source-Download.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract source and configure Minecraft 1.21.1
        shell: bash
        run: |
          unzip -q CaveBuddy-Source-Download.zip -d source
          MOD_DIR="$(find source -name build.gradle -o -name build.gradle.kts | head -n 1 | xargs dirname)"
          if [ -z "$MOD_DIR" ]; then
            echo "Could not find the mod source folder."
            exit 1
          fi
          echo "MOD_DIR=$MOD_DIR" >> "$GITHUB_ENV"
          cat > "$MOD_DIR/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.neoforged.net/releases' }
              }
          }
          rootProject.name = 'CaveBuddy'
          EOF
          cat > "$MOD_DIR/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          mod_id=cavebuddy
          mod_name=Cave Buddy
          mod_version=1.0.0
          mod_group=com.rexxplayz.cavebuddy
          minecraft_version=1.21.1
          neoforge_version=21.1.200
          EOF
          cat > "$MOD_DIR/build.gradle" <<'EOF'
          plugins {
              id 'java-library'
              id 'net.neoforged.moddev' version '2.0.107'
          }

          group = project.mod_group
          version = project.mod_version
          base.archivesName = project.mod_id

          java.toolchain.languageVersion = JavaLanguageVersion.of(21)

          neoForge {
              version = project.neoforge_version
              runs {
                  client { client() }
                  server { server(); programArgument '--nogui' }
              }
              mods {
                  "${project.mod_id}" {
                      sourceSet sourceSets.main
                  }
              }
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF
          # Update the mod metadata's declared Minecraft and NeoForge requirements.
          find "$MOD_DIR/src/main/resources" -name 'neoforge.mods.toml' -print0 | while IFS= read -r -d '' f; do
            sed -i -E 's/26\.3/1.21.1/g; s/\[26,/\[21.1,/g; s/\[25,/\[21,/g' "$f"
          done
          echo "Configured build for Minecraft 1.21.1 / NeoForge 21.1.200."
          echo "--- Mod metadata ---"
          cat "$MOD_DIR/src/main/resources/META-INF/neoforge.mods.toml"

      - name: Patch source for NeoForge 1.21.1 APIs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          import os\n          root = Path(os.environ["MOD_DIR"]) / "src/main/java/com/rexxplayz/cavebuddy"
          mod = root / "CaveBuddyMod.java"
          s = mod.read_text()
          s = s.replace("import net.neoforged.fml.javafmlmod.FMLJavaModLoadingContext;\n", "")
          s = s.replace("    public CaveBuddyMod() {\n        IEventBus modBus = FMLJavaModLoadingContext.get().getModEventBus();",
                        "    public CaveBuddyMod(IEventBus modBus) {")
          s = s.replace("event.accept(CAVE_BUDDY_SPAWN_EGG);", "event.accept(CAVE_BUDDY_SPAWN_EGG.get());")
          s = s.replace("event.accept(BUDDY_WHISTLE);", "event.accept(BUDDY_WHISTLE.get());")
          mod.write_text(s)

          entity = root / "entity/CaveBuddyEntity.java"
          s = entity.read_text().replace("        this.setTame(false);\n", "")
          entity.write_text(s)

          model = root / "client/CaveBuddyModel.java"
          s = model.read_text()
          s = s.replace("import net.minecraft.client.model.geom.ModelPart;\n",
                        "import net.minecraft.client.model.geom.ModelPart;\nimport com.mojang.blaze3d.vertex.PoseStack;\nimport com.mojang.blaze3d.vertex.VertexConsumer;\n")
          s = s.replace("    private final ModelPart body;", "    private final ModelPart root;\n    private final ModelPart body;")
          s = s.replace("    public CaveBuddyModel(ModelPart root) {\n        this.body",
                        "    public CaveBuddyModel(ModelPart root) {\n        this.root = root;\n        this.body")
          s = s.replace("    @Override\n    public void setupAnim(",
                        "    @Override\n    public void renderToBuffer(PoseStack poseStack, VertexConsumer buffer, int packedLight, int packedOverlay, int color) {\n        root.render(poseStack, buffer, packedLight, packedOverlay, color);\n    }\n\n    @Override\n    public void setupAnim(")
          model.write_text(s)
          print("Applied NeoForge 1.21.1 compatibility patches.")
          PY

          echo "--- Patched mod constructor and model methods ---"
          grep -nE 'CaveBuddyMod\\(|event.accept|renderToBuffer|this.root' "$MOD_DIR"/src/main/java/com/rexxplayz/cavebuddy/CaveBuddyMod.java "$MOD_DIR"/src/main/java/com/rexxplayz/cavebuddy/client/CaveBuddyModel.java

      - name: Build mod
        run: gradle --no-daemon clean build --stacktrace
        working-directory: ${{ env.MOD_DIR }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cave-buddy-jar
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
          if-no-files-found: error
